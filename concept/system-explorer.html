<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SYSTEMA — Operable Knowledge Machine</title>
<style>
  :root{
    --bg:#05060a; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.10);
    --fg:#e7e9f5; --muted:#8186a6; --green:#28c840; --cyan:#22d3ee;
    --setup:#7c5cff; --linux:#22d3ee; --devops:#f472b6; --docker:#38bdf8;
    --cicd:#fbbf24; --ut:#34d399; --llm:#a78bfa;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(124,92,255,.10), transparent 60%),
      radial-gradient(900px 700px at 10% 110%, rgba(34,211,238,.08), transparent 60%),
      var(--bg);}
  #stage.grabbing{cursor:grabbing}
  /* subtle PCB grid */
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(124,92,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(124,92,255,.05) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000,transparent 80%)}
  #world{position:absolute;top:0;left:0;width:1800px;height:1300px;transform-origin:0 0;will-change:transform}
  #world.dim .chip{opacity:.22;filter:saturate(.4)}
  #world.dim .chip.hl{opacity:1;filter:none}
  svg#wires{position:absolute;inset:0;width:1800px;height:1300px;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:rgba(255,255,255,.13);stroke-width:2}
  .edge.related{stroke-dasharray:2 7;stroke:rgba(255,255,255,.12)}
  .edge.live{stroke:rgba(40,200,64,.7);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(40,200,64,.5))}
  .edge.route{stroke:var(--cyan);stroke-width:3;filter:drop-shadow(0 0 8px rgba(34,211,238,.7));stroke-dasharray:10 6;animation:flow 1s linear infinite}
  .edge.hot{stroke:rgba(255,255,255,.4)}
  @keyframes flow{to{stroke-dashoffset:-32}}
  .packet{fill:var(--green);filter:drop-shadow(0 0 5px rgba(40,200,64,.9))}

  /* zones */
  .zone{position:absolute;border:1px dashed rgba(255,255,255,.10);border-radius:22px;
    background:rgba(255,255,255,.015);pointer-events:none}
  .zone b{position:absolute;top:-10px;left:18px;font:600 10px/1 var(--mono);letter-spacing:.22em;
    text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}

  /* chip */
  .chip{position:absolute;width:172px;padding:11px 13px;border-radius:13px;cursor:pointer;
    background:linear-gradient(180deg,#11131f,#0b0c15);border:1px solid var(--line);
    transition:opacity .25s,transform .18s,box-shadow .25s,border-color .25s;text-align:left}
  .chip:hover{transform:translateY(-2px)}
  .chip .pins{position:absolute;top:14px;bottom:14px;width:5px;display:flex;flex-direction:column;justify-content:space-between}
  .chip .pins span{height:2px;width:5px;background:rgba(255,255,255,.25);border-radius:2px}
  .chip .pins.l{left:-5px}.chip .pins.r{right:-5px}
  .chip .top{display:flex;align-items:center;gap:8px}
  .chip .led{width:9px;height:9px;border-radius:50%;background:#3a3f57;box-shadow:0 0 0 0 transparent;flex:0 0 auto}
  .chip .tag{font:600 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .chip h4{margin:8px 0 0;font:700 14px/1.2 var(--sans);color:var(--fg)}
  .chip .meta{margin-top:7px;display:flex;gap:8px;align-items:center;font:500 10px/1 var(--mono);color:var(--muted)}
  .chip .lock{position:absolute;top:10px;right:11px;font-size:12px;opacity:.7}
  .chip .buses{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
  .chip .buses i{font:600 9px/1 var(--mono);font-style:normal;padding:2px 6px;border-radius:5px;
    background:rgba(255,255,255,.05);color:var(--muted)}

  .chip[data-state="locked"]{opacity:.4}
  .chip[data-state="locked"]:hover{transform:none}
  .chip[data-state="dormant"]{border-color:rgba(255,255,255,.14)}
  .chip[data-state="powered"]{border-color:rgba(40,200,64,.55);box-shadow:0 0 0 1px rgba(40,200,64,.25),0 14px 40px -12px rgba(40,200,64,.4)}
  .chip[data-state="powered"] .led{background:var(--green);box-shadow:0 0 10px 2px rgba(40,200,64,.8);animation:pulseLed 2.4s ease-in-out infinite}
  .chip[data-state="active"]{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.5),0 18px 50px -14px rgba(34,211,238,.55)}
  .chip[data-state="active"] .led{background:var(--cyan);box-shadow:0 0 12px 3px rgba(34,211,238,.9)}
  @keyframes pulseLed{0%,100%{opacity:1}50%{opacity:.55}}
  .chip.boot{animation:boot .6s steps(2) 1}
  @keyframes boot{0%{opacity:.2}20%{opacity:.7}40%{opacity:.3}100%{opacity:.85}}

  /* datasheet only when zoomed in */
  #stage[data-level="far"] .chip h4{font-size:0}
  #stage[data-level="far"] .chip .meta,#stage[data-level="far"] .chip .buses{display:none}
  #stage[data-level="far"] .chip{width:96px;padding:9px}
  #stage[data-level="far"] .chip h4::after{content:attr(data-short);font:700 11px/1 var(--mono);color:var(--fg)}

  /* HUD */
  .hud{position:fixed;top:16px;left:16px;z-index:30;display:flex;flex-direction:column;gap:10px}
  .badge{backdrop-filter:blur(14px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .badge .ttl{font:600 9px/1 var(--mono);letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .integ{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .integ b{font:800 24px/1 var(--sans);background:linear-gradient(120deg,#7c5cff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meter{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#22d3ee,#28c840);transition:width .6s cubic-bezier(.22,1,.36,1)}
  .subleds{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;max-width:210px}
  .subleds span{display:flex;align-items:center;gap:4px;font:600 9px/1 var(--mono);color:var(--muted);text-transform:uppercase}
  .subleds span i{width:7px;height:7px;border-radius:50%;background:#3a3f57}
  .subleds span.on i{box-shadow:0 0 8px 1px currentColor}

  .toolbar{position:fixed;top:16px;right:16px;z-index:30;display:flex;gap:8px}
  .btn{backdrop-filter:blur(14px);background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:11px;padding:9px 12px;font:600 12px/1 var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}
  .btn:hover{border-color:rgba(124,92,255,.5);color:#fff}
  .btn.alt{color:var(--muted)}

  /* console */
  #console{position:fixed;left:16px;bottom:16px;z-index:30;width:min(440px,46vw);
    backdrop-filter:blur(16px);background:rgba(8,9,15,.78);border:1px solid var(--line);border-radius:14px;
    font-family:var(--mono);overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
  #console .bar{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  #console .bar .dot{width:9px;height:9px;border-radius:50%}
  #log{height:140px;overflow-y:auto;padding:10px 12px;font-size:12px;line-height:1.7}
  #log .cmd{color:var(--cyan)}
  #log .out{color:#aeb3d0}
  #log .warn{color:var(--cicd)}
  #log .ok{color:var(--green)}
  .inrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
  .inrow span{color:var(--green);font-size:13px}
  #cin{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font-family:var(--mono);font-size:13px}
  .cursor{width:8px;height:15px;background:var(--green);animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* minimap */
  #mini{position:fixed;right:16px;bottom:16px;z-index:30;width:188px;height:135px;border-radius:12px;
    backdrop-filter:blur(14px);background:rgba(8,9,15,.7);border:1px solid var(--line);overflow:hidden}
  #mini svg{width:100%;height:100%}
  #mini .mrect{fill:rgba(34,211,238,.12);stroke:var(--cyan);stroke-width:1.5}

  /* inspector */
  #inspect{position:fixed;top:0;right:0;z-index:40;height:100%;width:min(420px,90vw);
    background:linear-gradient(180deg,#0c0e18,#08090f);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .4s cubic-bezier(.22,1,.36,1);
    box-shadow:-30px 0 80px -30px rgba(0,0,0,.8);display:flex;flex-direction:column}
  #inspect.open{transform:none}
  #inspect .ihead{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
  #inspect .kicker{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
  #inspect h2{margin:12px 0 0;font:800 23px/1.15 var(--sans)}
  #inspect .ibody{padding:20px 22px;overflow-y:auto;flex:1;color:#b9bdd6;font-size:14px;line-height:1.7}
  #inspect .pin{display:flex;gap:8px;align-items:center;margin:6px 0;font:500 12px/1 var(--mono);color:var(--muted)}
  #inspect .open-guide{margin:18px 22px 22px;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px;border-radius:12px;background:linear-gradient(120deg,#7c5cff,#22d3ee);color:#fff;
    font:700 13px/1 var(--sans);text-decoration:none;cursor:pointer}
  #inspect .x{position:absolute;top:18px;right:18px;cursor:pointer;color:var(--muted);font-size:20px;background:none;border:0}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chiprow b{font:600 10px/1 var(--mono);padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.05);color:#cdd1ea;cursor:pointer}

  .hint{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);z-index:20;
    font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.05em;text-align:center;pointer-events:none;
    opacity:.8}
  .legend{position:fixed;top:120px;right:16px;z-index:25;display:flex;flex-direction:column;gap:6px;
    font:500 10px/1.4 var(--mono);color:var(--muted)}
  .legend div{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  @media (max-width:720px){.legend,#mini{display:none}#console{width:calc(100vw - 32px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage" data-level="mid">
  <div id="world">
    <svg id="wires"></svg>
  </div>
</div>

<div class="hud">
  <div class="badge">
    <div class="ttl">System Integrity</div>
    <div class="integ"><b id="integPct">0%</b><span style="color:var(--muted);font:500 11px/1 var(--mono)">powered</span></div>
    <div class="meter"><i id="integBar"></i></div>
    <div class="subleds" id="subleds"></div>
  </div>
</div>

<div class="toolbar">
  <button class="btn alt" id="probeBtn">🎲 Probe</button>
  <button class="btn alt" id="fitBtn">⤢ Fit</button>
  <button class="btn alt" id="resetBtn">⟲ Reset</button>
</div>

<div class="legend">
  <div><i style="background:#3a3f57"></i> locked / dormant</div>
  <div><i style="background:var(--green)"></i> powered (read)</div>
  <div><i style="background:var(--cyan)"></i> active</div>
  <div style="margin-top:4px">scroll = zoom · drag = pan</div>
</div>

<div class="hint">Hover a chip to inspect · click to <b style="color:var(--green)">power it on</b> · power flows downstream &amp; unlocks 🔒</div>

<div id="console">
  <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:4px">sys:// console — type <b style="color:var(--cyan)">help</b></span></div>
  <div id="log"></div>
  <div class="inrow"><span>&gt;</span><input id="cin" autocomplete="off" spellcheck="false" placeholder="ls · cd linux · open ssh · path setup gitlab · find docker"/><div class="cursor"></div></div>
</div>

<div id="mini"><svg id="minisvg" viewBox="0 0 1800 1300" preserveAspectRatio="xMidYMid meet"></svg></div>

<div id="inspect">
  <button class="x" id="inspClose">✕</button>
  <div class="ihead"><div class="kicker" id="iKicker">SUBSYSTEM</div><h2 id="iTitle">—</h2></div>
  <div class="ibody" id="iBody"></div>
  <a class="open-guide" id="iOpen">⎋ Open full guide</a>
</div>

<script>
(function(){
  "use strict";
  // ---------------- DATA: articles as modules in a system ----------------
  const SUB = {
    setup:{name:"Setup",c:"#7c5cff"}, linux:{name:"Linux",c:"#22d3ee"},
    devops:{name:"DevOps",c:"#f472b6"}, docker:{name:"Docker",c:"#38bdf8"},
    cicd:{name:"CI/CD",c:"#fbbf24"}, ut:{name:"Unit Testing",c:"#34d399"}, llm:{name:"LLM",c:"#a78bfa"}
  };
  const M = [
    {id:"setup",sub:"setup",title:"Install Ubuntu",short:"OS",x:120,y:240,rt:"4 min",href:"/setup",
      prereqs:[],related:[],buses:["ubuntu","vm"],
      summary:"Provision an Ubuntu VM with Multipass on Apple Silicon, Intel or Windows. The power source of the whole board — everything boots from here."},
    {id:"commands",sub:"linux",title:"Linux Commands",short:"CMD",x:430,y:150,rt:"9 min",href:"/linux",
      prereqs:["setup"],related:[],buses:["bash","cli"],
      summary:"The everyday command reference: files, permissions, processes, networking. The core logic chip of the machine."},
    {id:"ssh",sub:"linux",title:"SSH Setup Guide",short:"SSH",x:430,y:390,rt:"5 min",href:"/linux/ssh",
      prereqs:["commands"],related:["gitlab"],buses:["security","remote"],
      summary:"Configure OpenSSH, generate keys, fix permission-denied. Opens the data line out to the DevOps subsystem."},
    {id:"users",sub:"linux",title:"Users & Groups",short:"USR",x:720,y:300,rt:"11 min",href:"/linux/users-groups",
      prereqs:["commands"],related:["gitlab"],buses:["security","permissions"],
      summary:"Ownership, permissions and a full set of hands-on practice exercises. Rides the SECURITY bus."},
    {id:"gitlab",sub:"devops",title:"GitLab on Ubuntu",short:"GLB",x:1050,y:230,rt:"10 min",href:"/devops",
      prereqs:["ssh"],related:["users"],buses:["server","backup"],
      summary:"Self-host GitLab end-to-end: install, external URL, backup & restore, cron jobs. The main processor of the DevOps subsystem."},
    {id:"docker",sub:"docker",title:"Docker",short:"DKR",x:1050,y:500,rt:"soon",href:"/docker",soon:true,
      prereqs:["commands"],related:["cicd"],buses:["containers"],
      summary:"Images, containers, volumes, networks. Module fabricated, not yet soldered — coming soon."},
    {id:"cicd",sub:"cicd",title:"CI/CD Pipelines",short:"CI",x:1340,y:380,rt:"soon",href:"/cicd",soon:true,
      prereqs:["gitlab"],related:["docker"],buses:["server","automation"],
      summary:"Build, test, deploy automatically with your own runners. Rides the SERVER bus from GitLab — coming soon."},
    {id:"ut",sub:"ut",title:"Unit Testing",short:"UT",x:720,y:560,rt:"soon",href:"/ut",soon:true,
      prereqs:["commands"],related:[],buses:["testing","tdd"],
      summary:"Testing philosophy, patterns and frameworks. A new subsystem powering up next."},
    {id:"llm",sub:"llm",title:"LLM Engineering",short:"LLM",x:150,y:560,rt:"soon",href:"/llm",soon:true,
      prereqs:["setup"],related:[],buses:["ai","rag"],
      summary:"Prompting, RAG, agents and evaluation. Wired straight off the power source — coming soon."}
  ];
  const byId = Object.fromEntries(M.map(m=>[m.id,m]));
  const EDGES=[]; // {a,b,type}
  M.forEach(m=>{
    m.prereqs.forEach(p=>EDGES.push({a:p,b:m.id,type:"prereq"}));
    m.related.forEach(r=>{ if(!EDGES.some(e=>(e.a===m.id&&e.b===r)||(e.a===r&&e.b===m.id))) EDGES.push({a:m.id,b:r,type:"related"}); });
  });

  // ---------------- STATE ----------------
  const LS="systema.powered";
  let powered = new Set(JSON.parse(localStorage.getItem(LS)||"[]"));
  let active=null, hovered=null, route=[];
  const cam={x:60,y:90,s:.8};

  const $=s=>document.querySelector(s);
  const world=$("#world"), stage=$("#stage"), wires=$("#wires");

  function unlocked(m){ return m.prereqs.every(p=>powered.has(p)); }
  function stateOf(m){ if(m.id===active)return"active"; if(powered.has(m.id))return"powered"; return unlocked(m)?"dormant":"locked"; }

  // ---------------- BUILD DOM ----------------
  // zones
  const zoneBounds={};
  Object.keys(SUB).forEach(s=>{
    const ms=M.filter(m=>m.sub===s); if(!ms.length)return;
    const pad=26, x0=Math.min(...ms.map(m=>m.x))-pad, y0=Math.min(...ms.map(m=>m.y))-pad-6,
          x1=Math.max(...ms.map(m=>m.x+172))+pad, y1=Math.max(...ms.map(m=>m.y+96))+pad;
    zoneBounds[s]={x0,y0,x1,y1};
    const z=document.createElement("div"); z.className="zone";
    z.style.cssText=`left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px;border-color:${SUB[s].c}33`;
    z.innerHTML=`<b style="color:${SUB[s].c}">${SUB[s].name}</b>`;
    world.appendChild(z);
  });

  const chipEls={};
  M.forEach(m=>{
    const el=document.createElement("div"); el.className="chip"; el.style.left=m.x+"px"; el.style.top=m.y+"px";
    el.innerHTML=`<div class="pins l"><span></span><span></span><span></span></div>
      <div class="pins r"><span></span><span></span><span></span></div>
      ${m.soon?'<div class="lock" data-lock>🔒</div>':''}
      <div class="top"><span class="led"></span><span class="tag" style="color:${SUB[m.sub].c}">${SUB[m.sub].name}</span></div>
      <h4 data-short="${m.short}">${m.title}</h4>
      <div class="meta">◷ ${m.rt}</div>
      <div class="buses">${m.buses.slice(0,2).map(b=>`<i>${b}</i>`).join("")}</div>`;
    el.addEventListener("mouseenter",()=>setHover(m.id));
    el.addEventListener("mouseleave",()=>setHover(null));
    el.addEventListener("click",e=>{e.stopPropagation();onChipClick(m.id);});
    world.appendChild(el); chipEls[m.id]=el;
  });

  // sub LEDs
  const subleds=$("#subleds");
  Object.keys(SUB).forEach(s=>{
    const sp=document.createElement("span"); sp.dataset.sub=s; sp.style.color=SUB[s].c;
    sp.innerHTML=`<i style="background:#3a3f57"></i>${SUB[s].name}`; subleds.appendChild(sp);
  });

  // ---------------- RENDER ----------------
  function applyCam(){ world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
    stage.dataset.level = cam.s<0.62?"far":(cam.s>1.55?"near":"mid"); drawMini(); }

  function drawWires(){
    let h="";
    EDGES.forEach((e,i)=>{
      const a=byId[e.a],b=byId[e.b];
      const ax=a.x+172,ay=a.y+48,bx=b.x,by=b.y+48;
      const mx=(ax+bx)/2;
      const live = powered.has(e.a) && (powered.has(e.b)||e.b===active);
      const onRoute = route.length>1 && route.some((r,idx)=>idx<route.length-1 && ((route[idx]===e.a&&route[idx+1]===e.b)||(route[idx]===e.b&&route[idx+1]===e.a)));
      const hot = hovered && (e.a===hovered||e.b===hovered);
      const cls=["edge",e.type,live?"live":"",onRoute?"route":"",hot?"hot":""].filter(Boolean).join(" ");
      h+=`<path id="edge${i}" class="${cls}" d="M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}"/>`;
    });
    wires.innerHTML=h;
  }

  function render(){
    M.forEach(m=>{ const st=stateOf(m); const el=chipEls[m.id];
      if(el.dataset.state!==st && st==="dormant" && el.dataset.state==="locked"){ el.classList.add("boot"); setTimeout(()=>el.classList.remove("boot"),650); }
      el.dataset.state=st;
      const lk=el.querySelector('[data-lock]'); if(lk) lk.textContent = unlocked(m)?"":"🔒";
    });
    drawWires();
    // integrity
    const pct=Math.round(powered.size/M.length*100);
    $("#integPct").textContent=pct+"%"; $("#integBar").style.width=pct+"%";
    // sub leds: lit if any module in sub powered
    document.querySelectorAll("#subleds span").forEach(sp=>{
      const on=M.some(m=>m.sub===sp.dataset.sub&&powered.has(m.id));
      sp.classList.toggle("on",on); sp.querySelector("i").style.background=on?SUB[sp.dataset.sub].c:"#3a3f57";
    });
  }

  function setHover(id){
    hovered=id;
    if(!id){ world.classList.remove("dim"); M.forEach(m=>chipEls[m.id].classList.remove("hl")); drawWires(); return; }
    world.classList.add("dim");
    const keep=new Set([id]); EDGES.forEach(e=>{ if(e.a===id)keep.add(e.b); if(e.b===id)keep.add(e.a); });
    M.forEach(m=>chipEls[m.id].classList.toggle("hl",keep.has(m.id)));
    drawWires();
  }

  // ---------------- ACTIONS ----------------
  function power(id,quiet){ const m=byId[id]; if(!m)return false;
    if(!unlocked(m)){ if(!quiet)log(`⚠ ${m.title} is LOCKED — needs: ${m.prereqs.map(p=>byId[p].title).join(", ")}`,"warn"); shake(id); return false; }
    if(!powered.has(id)){ powered.add(id); localStorage.setItem(LS,JSON.stringify([...powered])); pulse(id); }
    return true;
  }
  function onChipClick(id){ const m=byId[id];
    if(!unlocked(m)){ log(`> open ${id}`,"cmd"); power(id); render(); return; }
    log(`> open ${id}`,"cmd");
    if(power(id,true)){ active=id; render(); openInspector(m); flyTo(m.x+86,m.y+48,1.15); log(`✓ ${m.title} powered. ${downstreamMsg(id)}`,"ok"); }
  }
  function downstreamMsg(id){ const newly=M.filter(m=>m.prereqs.includes(id)&&unlocked(m)&&!powered.has(m.id)); return newly.length?`Unlocked: ${newly.map(m=>m.title).join(", ")}`:"No new modules unlocked."; }

  function pulse(id){ // animate charge along outgoing edges
    EDGES.forEach((e,i)=>{ if(e.a!==id)return; const path=document.getElementById("edge"+i); if(!path)return;
      const len=path.getTotalLength(); const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("r","4"); c.setAttribute("class","packet"); wires.appendChild(c);
      let t=0; const step=()=>{ t+=0.03; if(t>=1){c.remove();return;} const p=path.getPointAtLength(len*t); c.setAttribute("cx",p.x); c.setAttribute("cy",p.y); requestAnimationFrame(step); }; requestAnimationFrame(step);
    });
  }
  function shake(id){ const el=chipEls[id]; el.animate([{transform:el.style.transform+" translateX(0)"},{transform:el.style.transform+" translateX(-4px)"},{transform:el.style.transform+" translateX(4px)"},{transform:el.style.transform+" translateX(0)"}],{duration:240}); }

  // ---------------- INSPECTOR ----------------
  function openInspector(m){
    $("#iKicker").textContent=SUB[m.sub].name+" subsystem"; $("#iKicker").style.color=SUB[m.sub].c;
    $("#iTitle").textContent=m.title;
    const ins=m.prereqs.map(p=>`<div class="pin">◀ in &nbsp; <b style="color:#cdd1ea;cursor:pointer" data-go="${p}">${byId[p].title}</b></div>`).join("")||'<div class="pin">◀ in &nbsp; power source</div>';
    const outs=M.filter(x=>x.prereqs.includes(m.id)).map(x=>`<div class="pin">out ▶ &nbsp; <b style="color:#cdd1ea;cursor:pointer" data-go="${x.id}">${x.title}</b></div>`).join("")||'<div class="pin">out ▶ &nbsp; (terminal node)</div>';
    $("#iBody").innerHTML=`<p>${m.summary}</p>
      <div style="margin:16px 0 6px;font:600 10px/1 var(--mono);letter-spacing:.2em;color:var(--muted)">PINS</div>${ins}${outs}
      <div style="margin:16px 0 6px;font:600 10px/1 var(--mono);letter-spacing:.2em;color:var(--muted)">BUSES (tags)</div>
      <div class="chiprow">${m.buses.map(b=>`<b data-bus="${b}">${b}</b>`).join("")}</div>
      <div style="margin-top:16px;font:500 12px/1 var(--mono);color:var(--muted)">◷ ${m.rt}${m.soon?' · <span style="color:var(--cicd)">module coming soon</span>':''}</div>`;
    const og=$("#iOpen"); og.textContent = m.soon?"⌛ Coming soon":"⎋ Open full guide";
    og.style.opacity=m.soon?.5:1; og.style.pointerEvents=m.soon?"none":"auto";
    og.onclick=()=>log(`→ would navigate to ${m.href}`,"out");
    $("#iBody").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>onChipClick(b.dataset.go));
    $("#iBody").querySelectorAll("[data-bus]").forEach(b=>b.onclick=()=>highlightBus(b.dataset.bus));
    $("#inspect").classList.add("open");
  }
  $("#inspClose").onclick=()=>{ $("#inspect").classList.remove("open"); active=null; render(); };

  function highlightBus(bus){ log(`> bus ${bus}`,"cmd");
    const hits=M.filter(m=>m.buses.includes(bus)); if(!hits.length)return;
    world.classList.add("dim"); M.forEach(m=>chipEls[m.id].classList.toggle("hl",m.buses.includes(bus)));
    log(`riding BUS ${bus}: ${hits.map(m=>m.title).join(" ↔ ")}`,"out");
    setTimeout(()=>{ if(!hovered){world.classList.remove("dim");M.forEach(m=>chipEls[m.id].classList.remove("hl"));} },2600);
    fitTo(hits);
  }

  // ---------------- CAMERA ----------------
  function flyTo(wx,wy,scale){ const s=scale||cam.s; const tx=window.innerWidth/2 - wx*s, ty=window.innerHeight/2 - wy*s; tween(tx,ty,s); }
  function fitTo(list){ const ms=list||M; const x0=Math.min(...ms.map(m=>m.x))-60,y0=Math.min(...ms.map(m=>m.y))-60,
      x1=Math.max(...ms.map(m=>m.x+172))+60,y1=Math.max(...ms.map(m=>m.y+96))+60;
    const s=Math.min(window.innerWidth/(x1-x0),(window.innerHeight)/(y1-y0),1.4)*.92;
    tween(window.innerWidth/2-( (x0+x1)/2)*s, window.innerHeight/2-((y0+y1)/2)*s, s); }
  function tween(tx,ty,ts){ const sx=cam.x,sy=cam.y,ss=cam.s; let t=0;
    const step=()=>{ t+=0.08; const k=t<1?1-Math.pow(1-t,3):1; cam.x=sx+(tx-sx)*k; cam.y=sy+(ty-sy)*k; cam.s=ss+(ts-ss)*k; applyCam(); if(t<1)requestAnimationFrame(step); }; requestAnimationFrame(step); }

  // pan & zoom
  let drag=null;
  stage.addEventListener("pointerdown",e=>{ if(e.target.closest(".chip")||e.target.closest("#console")||e.target.closest("#inspect"))return; drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; stage.classList.add("grabbing"); });
  window.addEventListener("pointermove",e=>{ if(!drag)return; cam.x=drag.cx+(e.clientX-drag.x); cam.y=drag.cy+(e.clientY-drag.y); applyCam(); });
  window.addEventListener("pointerup",()=>{ drag=null; stage.classList.remove("grabbing"); });
  stage.addEventListener("wheel",e=>{ e.preventDefault(); const f=e.deltaY<0?1.12:0.89; const ns=Math.min(2.4,Math.max(.35,cam.s*f));
    const wx=(e.clientX-cam.x)/cam.s, wy=(e.clientY-cam.y)/cam.s; cam.x=e.clientX-wx*ns; cam.y=e.clientY-wy*ns; cam.s=ns; applyCam(); },{passive:false});

  // ---------------- CONSOLE ----------------
  const logEl=$("#log");
  function log(t,cls){ const d=document.createElement("div"); d.className=cls||"out"; d.textContent=t; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
  function find(q){ q=q.toLowerCase(); return M.filter(m=>m.id.includes(q)||m.title.toLowerCase().includes(q)||m.buses.some(b=>b.includes(q))); }
  function bfs(a,b){ if(!byId[a]||!byId[b])return null; const adj={}; M.forEach(m=>adj[m.id]=[]); EDGES.forEach(e=>{adj[e.a].push(e.b);adj[e.b].push(e.a);});
    const q=[[a]],seen=new Set([a]); while(q.length){ const p=q.shift(); if(p[p.length-1]===b)return p; for(const n of adj[p[p.length-1]]) if(!seen.has(n)){seen.add(n);q.push([...p,n]);} } return null; }

  const cin=$("#cin");
  cin.addEventListener("keydown",e=>{ if(e.key!=="Enter")return; const raw=cin.value.trim(); cin.value=""; if(!raw)return;
    log("> "+raw,"cmd"); const [cmd,...a]=raw.split(/\s+/); const arg=a.join(" "); run(cmd.toLowerCase(),a,arg); });
  function run(cmd,a,arg){
    switch(cmd){
      case"help": log("commands: ls · cd <sub> · open <id> · power <id> · find <q> · path <a> <b> · trace <id> · bus <tag> · reset · fit","out"); break;
      case"ls": log("subsystems: "+Object.keys(SUB).join("  "),"out"); log("modules: "+M.map(m=>m.id).join("  "),"out"); break;
      case"cd": { const s=a[0]; if(!SUB[s]){log("no such subsystem: "+s,"warn");break;} fitTo(M.filter(m=>m.sub===s)); log("→ entered "+SUB[s].name,"ok"); break; }
      case"open": { const m=byId[a[0]]; if(!m){log("no module: "+a[0],"warn");break;} onChipClick(m.id); break; }
      case"power": { const m=byId[a[0]]; if(!m){log("no module: "+a[0],"warn");break;} if(power(m.id)){render();log("✓ powered "+m.id,"ok");flyTo(m.x+86,m.y+48);} break; }
      case"find": { const r=find(arg); if(!r.length){log("no match","warn");break;} log("found: "+r.map(m=>m.id).join(", "),"ok"); world.classList.add("dim"); M.forEach(m=>chipEls[m.id].classList.remove("hl")); r.forEach(m=>chipEls[m.id].classList.add("hl")); fitTo(r); setTimeout(()=>{if(!hovered){world.classList.remove("dim");M.forEach(m=>chipEls[m.id].classList.remove("hl"));}},2800); break; }
      case"path": { const p=bfs(a[0],a[1]); if(!p){log("no route","warn");break;} route=p; drawWires(); log("route: "+p.join(" → "),"ok"); fitTo(p.map(id=>byId[id])); setTimeout(()=>{route=[];drawWires();},4000); break; }
      case"trace": { const m=byId[a[0]]; if(!m){log("no module","warn");break;} const ns=EDGES.filter(e=>e.a===m.id||e.b===m.id).map(e=>e.a===m.id?e.b:e.a); log(m.id+" ↔ "+ns.join(", "),"out"); setHover(m.id); break; }
      case"bus": highlightBus(a[0]); break;
      case"reset": powered=new Set(); active=null; localStorage.setItem(LS,"[]"); render(); $("#inspect").classList.remove("open"); log("⟲ all power cut.","warn"); break;
      case"fit": fitTo(); break;
      case"clear": logEl.innerHTML=""; break;
      default: log("unknown: "+cmd+" (try help)","warn");
    }
  }

  // ---------------- MINIMAP ----------------
  function drawMini(){ const svg=$("#minisvg"); let h="";
    Object.keys(zoneBounds).forEach(s=>{const z=zoneBounds[s];h+=`<rect x="${z.x0}" y="${z.y0}" width="${z.x1-z.x0}" height="${z.y1-z.y0}" rx="20" fill="${SUB[s].c}10" stroke="${SUB[s].c}40"/>`;});
    M.forEach(m=>{const on=powered.has(m.id);h+=`<circle cx="${m.x+86}" cy="${m.y+48}" r="14" fill="${on?'#28c840':'#3a3f57'}"/>`;});
    const vx=-cam.x/cam.s, vy=-cam.y/cam.s, vw=window.innerWidth/cam.s, vh=window.innerHeight/cam.s;
    h+=`<rect class="mrect" x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="8"/>`;
    svg.innerHTML=h;
  }

  // buttons
  $("#resetBtn").onclick=()=>run("reset",[],"");
  $("#fitBtn").onclick=()=>fitTo();
  $("#probeBtn").onclick=()=>{ const cands=M.filter(m=>unlocked(m)&&!powered.has(m.id)); const m=cands[Math.floor(Math.random()*cands.length)]||M.find(m=>!powered.has(m.id)); if(m){log("🎲 probing → "+m.id,"out"); onChipClick(m.id);} };

  // boot
  log("SYSTEMA online. "+M.length+" modules detected.","ok");
  log("Tip: power 'Install Ubuntu' first — it's the source.","out");
  render(); applyCam(); fitTo();
  window.addEventListener("resize",()=>{applyCam();});
})();
</script>
</body>
</html>
